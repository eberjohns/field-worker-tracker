[project]
name = "field-worker-tracker-backend"
version = "0.1.0"
description = "Field Worker Tracker Backend API and Worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "geoalchemy2>=0.15.2",
    "shapely>=2.0.6",
    "procrastinate>=3.5.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "structlog>=24.4.0",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.1",
    "pyright>=1.1.386",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function call in argument defaults (standard FastAPI Depends)
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "migrations"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
strictParameterNoneValue = true
reportMissingImports = true
reportMissingTypeStubs = false

[tool.importlinter]
root_package = "fw"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modular monolith layers contract"
type = "layers"
layers = [
    "fw.modules.reports | fw.modules.imports",
    "fw.modules.payroll",
    "fw.modules.attendance",
    "fw.modules.sync | fw.modules.notifications",
    "fw.modules.scheduling | fw.modules.events",
    "fw.modules.jobs",
    "fw.modules.org",
    "fw.modules.settings | fw.modules.identity | fw.modules.audit",
    "fw.core",
]

[[tool.importlinter.contracts]]
name = "Pure business rules contract"
type = "forbidden"
source_modules = ["fw.rules"]
forbidden_modules = [
    "fw.modules",
    "fw.adapters",
    "fastapi",
    "sqlalchemy",
]
